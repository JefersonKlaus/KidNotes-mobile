[project]
name = "kidnotes-mobile"
version = "0.2.0"
description = "RelatórioFácil Infantil - learning stories (photos and notes of significant moments) for early childhood education."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet==1.0.5",
    # Android Keystore / iOS Keychain access (stores the database key).
    "flet-secure-storage==1.0.5",
    # Camera preview + capture for event photos.
    "flet-camera==1.0.5",
    # AES-256-GCM encryption of the database records. Android/iOS builds get
    # the prebuilt binary from Flet's mobile package index.
    "cryptography>=41",
    # HTTP client for the Groq API (report drafts). Pure Python.
    "httpx>=0.27",
]

[dependency-groups]
# Development environment: the app dependencies (keep in sync with
# [project].dependencies, checked by tests/test_project_config.py), the Flet
# CLI + desktop runner (`flet run`, `flet build`) and pytest.
dev = [
    "flet[all]==1.0.5",
    "flet-secure-storage==1.0.5",
    "flet-camera==1.0.5",
    "cryptography>=41",
    "httpx>=0.27",
    "pytest>=8.0",
    # Linter (same version here and in CI: .github/workflows/ci.yml).
    "ruff==0.17.3",
    # Tests read the generated PDFs back and render them (not bundled into the app).
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    # Makes real JPEG/PNG test images (EXIF orientation, transparency...). Tests only:
    # the app writes photos into the PDF without Pillow (reports/images.py).
    "pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Lint: `ruff check .` (CI runs it on every push and pull request).
[tool.ruff]
line-length = 100
target-version = "py310"  # the oldest Python in requires-python
extend-exclude = [".flet"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/variables, undefined names...
    "I",   # import order
    "B",   # bugbear: likely bugs
    "UP",  # pyupgrade: modern syntax for the target Python
]

# Mobile build configuration used by `flet build apk | aab | ipa`.
# Docs: https://docs.flet.dev/publish/
[tool.flet]
# Bundle id = "<org>.<project name>" -> com.kidnotes.kidnotes_mobile
# Change `org` to your own reverse domain before publishing to the stores.
org = "com.kidnotes"
product = "RelatórioFácil Infantil"
company = "KidNotes"
# Camera for event photos. Gallery photos use the system picker, which needs
# no storage/media permission on Android (so "photo_library" is not requested).
permissions = ["camera"]

[tool.flet.app]
module = "main"
# Keep development-only files out of the APK/IPA bundle.
exclude = ["tests"]

[tool.flet.ios.info]
# Languages the app is localized to (see i18n.py). English is the fallback.
CFBundleDevelopmentRegion = "en"
CFBundleLocalizations = ["en", "pt"]
# Texts shown by iOS when asking for access (they replace Flet's generic ones).
NSCameraUsageDescription = "Take photos of significant moments for the children's learning stories. Photos are stored encrypted on this device."
NSPhotoLibraryUsageDescription = "Choose photos of significant moments for the children's learning stories. Photos are stored encrypted on this device."
