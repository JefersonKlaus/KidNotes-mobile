# Continuous integration: on every push (any branch) and pull request,
# check the code with ruff (lint) and run the pytest suite.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:  # "Run workflow" button in the Actions tab

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The ruff version comes from the dev group in pyproject.toml, so CI and
      # the developers' machines always use the same one.
      - name: Install ruff
        run: |
          RUFF=$(python -c "import tomllib; dev = tomllib.load(open('pyproject.toml', 'rb'))['dependency-groups']['dev']; print(next(d for d in dev if d.startswith('ruff')))")
          python -m pip install "$RUFF"

      # Problems are shown inline on the commit / pull request ("github" format).
      - name: ruff check
        run: ruff check --output-format=github .

  tests:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"  # the oldest supported (requires-python)
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest  # the team develops on Windows
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # `pip install --group` needs pip 25.1 or newer.
      - name: Install the dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: pytest
        run: python -m pytest -q
